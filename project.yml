name: Antiphon
options:
  bundleIdPrefix: com.kounex
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

packages:
  AntiphonDesign:
    path: Packages/AntiphonDesign

settings:
  base:
    # Override ANTIPHON_BUNDLE_ID (not PRODUCT_BUNDLE_IDENTIFIER) for side-by-side
    # dev installs: a command-line PRODUCT_BUNDLE_IDENTIFIER also renames the
    # AntiphonDesign resource bundle, and its colors stop resolving. Set here so
    # the extensions derive their IDs and the App Group from it too.
    ANTIPHON_BUNDLE_ID: com.kounex.antiphon
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 14
    MARKETING_VERSION: "1.4.5"
    CODE_SIGN_STYLE: Automatic

targets:
  Antiphon:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Antiphon
        excludes:
          - "**/.DS_Store"
      # Compiled into the app and its extensions (snapshot, App Group).
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIPHON_BUNDLE_ID)
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Antiphon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Antiphon needs access to your Apple Music library to sync playlists."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        SWIFT_STRICT_CONCURRENCY: complete
        # Light and dark Home Screen icons for the Appearance setting; the
        # primary AppIcon.icon follows the system.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Light AppIcon-Dark"
      configs:
        # ANTIPHON_APP: code in Shared/ that only the app runs (SyncAllIntent).
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG ANTIPHON_APP
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ANTIPHON_APP
    entitlements:
      path: Antiphon/Antiphon.entitlements
      properties:
        # Shared with the widget and share extensions; derived from the
        # bundle ID so the dev app gets its own.
        com.apple.security.application-groups:
          - group.$(ANTIPHON_BUNDLE_ID)
    info:
      path: Antiphon/Info.plist
      properties:
        AntiphonAppGroup: group.$(ANTIPHON_BUNDLE_ID)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: "Spotify Callback"
            CFBundleURLSchemes:
              - antiphon
        BGTaskSchedulerPermittedIdentifiers:
          - com.antiphon.playlistRefresh
          # A sync the person started, continued in the background (one per run).
          - $(PRODUCT_BUNDLE_IDENTIFIER).sync.*
        # Background refresh (monitoring) needs it; it was dropped in 1.2.1,
        # which stopped iOS from scheduling background checks.
        UIBackgroundModes:
          - fetch
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: true
        com.apple.developer.musickit:
          enabled: true
    dependencies:
      - package: AntiphonDesign
      - target: AntiphonWidgets

  AntiphonWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
        excludes:
          - "**/.DS_Store"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIPHON_BUNDLE_ID).widgets
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Antiphon
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/AntiphonWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(ANTIPHON_BUNDLE_ID)
    info:
      path: Widgets/Info.plist
      properties:
        AntiphonAppGroup: group.$(ANTIPHON_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: AntiphonDesign

  AntiphonTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/AntiphonTests
    dependencies:
      - target: Antiphon
      - package: AntiphonDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kounex.antiphon.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Antiphon (Debug):
    build:
      targets:
        Antiphon: all
        AntiphonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AntiphonTests
    profile:
      config: Debug
    archive:
      config: Debug

  Antiphon (Release):
    build:
      targets:
        Antiphon: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
